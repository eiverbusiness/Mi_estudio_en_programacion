<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!--Yo le copie esto al que me mando a calquear la pagina web el portafolio pero no se que hace -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora || Basica</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="calculadora"> <!-- cuerpo de calculadora-->
        <!-- "pantalla" donde vamos a hacer las operaciones matematicas -->
        <div class="pantalla">0</div>

        <button class="btn" id="c">C</button> <!--Botones-->
            <button class="btn" id="borrar">&LeftArrow;</button>
            <button class="btn">&divide;</button>
            <button class="btn">*</button>
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn">-</button>
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn">+</button>
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn" id="igual">=</button>
            <button class="btn" id="cero">0</button>
            <button class="btn">.</button>
    </div>


    <script src="assets/js/main.js"></script>
</body>
</html>
